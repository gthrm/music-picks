# Lidarr (library + torrent route), slskd (Soulseek client), Soularr (feeds Lidarr's wanted albums to slskd).
# Soulseek login comes from .env: SLSK_USERNAME / SLSK_PASSWORD.
services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    environment: [PUID=1000, PGID=1000, TZ=Europe/Berlin]
    volumes:
      - ./lidarr:/config
      - type: bind
        source: /mnt/backup/media
        target: /media
        bind: {create_host_path: false}
    ports: ["127.0.0.1:8686:8686"]
    networks:
      media: {ipv4_address: 172.31.77.13}

  slskd:
    image: slskd/slskd:latest
    container_name: slskd
    restart: unless-stopped
    user: "1000:1000"
    environment:
      - TZ=Europe/Berlin
      - SLSKD_REMOTE_CONFIGURATION=false
      - SLSKD_SLSK_USERNAME=${SLSK_USERNAME:-}
      - SLSKD_SLSK_PASSWORD=${SLSK_PASSWORD:-}
      - SLSKD_DOWNLOADS_DIR=/media/slskd
      - SLSKD_INCOMPLETE_DIR=/media/slskd/incomplete
      - SLSKD_SHARED_DIR=/media/music
    volumes:
      - ./slskd:/app
      - type: bind
        source: /mnt/backup/media
        target: /media
        bind: {create_host_path: false}
    ports: ["127.0.0.1:5030:5030"]   # no inbound 50300: mobile internet (CGNAT), outbound-only is fine
    networks:
      media: {ipv4_address: 172.31.77.14}

  soularr:
    image: mrusse08/soularr:latest
    container_name: soularr
    restart: unless-stopped
    user: "1002:1000"   # own ./soularr, group-write to /media/slskd
    environment: [TZ=Europe/Berlin, SCRIPT_INTERVAL=300, WEBUI_ENABLED=false]
    volumes:
      - ./soularr:/data
      - type: bind
        source: /mnt/backup/media
        target: /media
        bind: {create_host_path: false}
    depends_on: [lidarr, slskd]
    networks:
      media: {ipv4_address: 172.31.77.15}

networks:
  media: {external: true}
